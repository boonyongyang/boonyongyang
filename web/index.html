<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Boon Yong Yang's interactive Flutter portfolio with production work, maps, charts, games, and engineering experiments.">
  <meta name="author" content="Boon Yong Yang">
  <meta name="google-site-verification" content="__GOOGLE_SITE_VERIFICATION__">
  <link rel="canonical" href="__PORTFOLIO_ORIGIN__/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="__PORTFOLIO_ORIGIN__/">
  <meta property="og:title" content="Boon Yong Yang | Interactive Flutter Portfolio">
  <meta property="og:description" content="An interactive Flutter portfolio with production work, maps, charts, games, and engineering experiments.">
  <meta property="og:image" content="__PORTFOLIO_ORIGIN__/icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Boon Yong Yang | Interactive Flutter Portfolio">
  <meta name="twitter:description" content="Production Flutter work and interactive engineering experiments.">
  <meta name="twitter:image" content="__PORTFOLIO_ORIGIN__/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="boonyongyang">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Boon Yong Yang | Interactive Flutter Portfolio</title>
  <link rel="manifest" href="manifest.json">
  <script
    src="portfolio-analytics.js"
    data-measurement-id="__ANALYTICS_MEASUREMENT_ID__"
    data-version="__PORTFOLIO_VERSION__"
    defer
  ></script>

</head>
<body>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    window.addEventListener('load', function() {
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
      });
    });
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Boon Yong Yang Interactive Flutter Portfolio",
      "url": "__PORTFOLIO_ORIGIN__/",
      "applicationCategory": "Portfolio",
      "operatingSystem": "Web",
      "author": {
        "@type": "Person",
        "name": "Boon Yong Yang",
        "url": "https://boonyongyang.com/"
      }
    }
  </script>
</body>
</html>
