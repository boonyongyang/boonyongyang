name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  build-web:
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visual-tests/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install visual regression dependencies
        run: make visual_get

      - name: Install pinned Chromium
        run: make visual_install_browser

      - name: Build and compare deployment layouts
        run: make visual_test

      - name: Retain visual regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-layout-regression-evidence
          path: |
            visual-tests/verification/
            visual-tests/tests/__screenshots__/*-linux/
          if-no-files-found: warn
          retention-days: 7
