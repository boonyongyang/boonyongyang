name: Portfolio Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: portfolio-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify live portfolio surfaces
        run: make production_smoke

      - name: Retain production smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-production-smoke-${{ github.run_id }}
          path: verification/production-smoke.json
          if-no-files-found: error
          retention-days: 30
