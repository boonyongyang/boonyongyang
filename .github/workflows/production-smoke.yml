name: Portfolio Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: portfolio-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify live portfolio surfaces
        run: make production_smoke
